name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tests/test_mitigation.py compares against the pre-refactor commit
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install (CPU-only torch keeps the runner small)
        run: |
          uv venv
          uv pip install --torch-backend cpu -e ".[dev]"
      - name: Run tests
        run: uv run --no-sync pytest -q
